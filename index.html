<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>나의 첫 웹페이지</title>
</head>
<body>
  <!-- 8페이지에서 작성한 UX 계획 주석 -->
  
  <header>
    <h1>올바른 자세 가이드 </h1>
    <p>올바른 자세를 유지하여 건강을 지킵니다.</p>
  </header>

  <h2>서비스 소개</h2>
  <h3>올바른 자세를 유지하는 연습</h3>
  <p>올바른 자세가 무엇인지 알고, 유지하는 시간을 점차 늘려가며 연습합니다.</p>
  <p>올바른 자세를 유지하는 시간을 기록하고
     편안하게 느껴지도록 습관화합니다.</p>

  <h2>훈련 기능</h2>
  <ul>
    <li>
      <h3>바른 자세에 대한 정보</h3>
      <p>여러가지 상황에 대한 올바른 자세 정보를 제공합니다.</p>
    </li>
    <li>
      <h3>따라해보기</h3>
      <p>본인의 상황에 따라 올바른 자세를 연습해볼 수 있습니다.</p>
    </li>
    <li>
      <h3>자세 유지 기록</h3>
      <p>올바른 자세를 유지한 시간을 기록하고 분석합니다.</p>
    </li>
  </ul>
</body>
</html>
